      multipleOf: 0.01
    PositiveMoney:
      type: number
      format: decimal
      x-go-type: jsonnumber.Number
      x-go-type-import:
        path: encoding/json
        name: jsonnumber
      minimum: 0.01
      maximum: 9999999999.99
      multipleOf: 0.01
