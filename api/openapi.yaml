          format: date-time
        valid_until:
          type: string
          format: date-time
        active:
          type: boolean
    PromoCodeResponse:
      allOf:
        - $ref: '#/components/schemas/PromoCodeCreate'
        - type: object
          required: [id, current_uses]
          properties:
            id:
              type: string
              format: uuid
            current_uses:
              type: integer
              format: int32
